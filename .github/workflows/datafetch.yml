name: research-data-fetch
on:
  push:
    branches: [data-fetch]
    paths: [datafetch/fetch.py, .github/workflows/datafetch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-fetch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "yfinance>=0.2.54" pandas requests openpyxl xlrd
      - run: python datafetch/fetch.py
      - name: Commit data
        run: |
          git config user.name "data-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datafetch/out
          git commit -m "Add fetched research data [skip ci]" || echo "nothing to commit"
          git push origin HEAD:data-fetch
